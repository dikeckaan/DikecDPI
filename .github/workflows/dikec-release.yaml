name: Dikec DPI release

# Push a tag like v1.0.0 to build every binary, publish a GitHub release and
# update the Homebrew tap (formula + cask).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.0.0"
        required: true

permissions:
  contents: write

env:
  GO_VERSION: "1.26"
  # Homebrew tap repository. Needs the TAP_DEPLOY_KEY secret: the private
  # half of a deploy key with write access to that repo only. Without it
  # the tap step is skipped.
  TAP_REPO: ${{ github.repository_owner }}/homebrew-dikecdpi

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  cli:
    needs: meta
    # Same platforms as upstream SpoofDPI: darwin needs cgo (libpcap) and is
    # built on macOS; linux is pure Go. Windows is not supported upstream.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, goos: darwin, goarch: arm64, cgo: "1" }
          - { os: macos-latest, goos: darwin, goarch: amd64, cgo: "1" }
          - { os: ubuntu-latest, goos: linux, goarch: amd64, cgo: "0" }
          - { os: ubuntu-latest, goos: linux, goarch: arm64, cgo: "0" }
          - { os: ubuntu-latest, goos: linux, goarch: arm, cgo: "0" }
          - { os: ubuntu-latest, goos: linux, goarch: mipsle, cgo: "0" }
          - { os: ubuntu-latest, goos: linux, goarch: riscv64, cgo: "0" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.meta.outputs.tag }}" }
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}" }
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          GOMIPS: softfloat
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          name="dikecdpi-${VERSION}-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA::7} -X main.build=release" \
            -o dist/dikecdpi ./cmd/spoofdpi
          cp LICENSE README.md dist/
          tar -C dist -czf "${name}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dikecdpi-*

  gui-macos:
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.meta.outputs.tag }}" }
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: gui/go.sum
      - name: Build Dikec DPI.app (universal)
        run: gui/build/package.sh "${{ needs.meta.outputs.version }}" universal
      - uses: actions/upload-artifact@v4
        with:
          name: gui-macos
          path: gui/dist/*.zip

  release:
    needs: [meta, cli, gui-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.meta.outputs.tag }}" }
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Dikec DPI $TAG" --generate-notes
          gh release upload "$TAG" out/* --clobber

      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then echo "TAP_DEPLOY_KEY not set; skipping tap update"; exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key && chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          src="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          srcsha=$(curl -sL "$src" | sha256sum | cut -d' ' -f1)
          appsha=$(sha256sum "out/DikecDPI-${VERSION}-macos-universal.zip" | cut -d' ' -f1)
          git clone "git@github.com:${TAP_REPO}.git" tap
          packaging/homebrew/render.sh "$GITHUB_REPOSITORY" "$VERSION" "$src" "$srcsha" "$appsha" tap
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "tap already up to date"; exit 0; fi
          git commit -m "dikecdpi ${VERSION}" && git push
