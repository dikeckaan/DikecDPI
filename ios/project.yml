# Generate the Xcode project with:  cd ios && xcodegen
name: DikecDPI
options:
  bundleIdPrefix: com.dikec
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: AQ2Y664A4Z
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
    OTHER_LDFLAGS: [-lresolv]
targets:
  DikecDPI:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: DikecTunnel
      - framework: Frameworks/Dikeccore.xcframework
        embed: false
    entitlements:
      path: App/DikecDPI.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.com.dikec.dpi]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Dikec DPI
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr, ru, fa, ar, zh-Hans, id, es]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dikec.dpi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DikecTunnel:
    type: app-extension
    platform: iOS
    sources:
      - Tunnel
      - Shared
    dependencies:
      - framework: Frameworks/Dikeccore.xcframework
        embed: false
      - sdk: NetworkExtension.framework
    entitlements:
      path: Tunnel/DikecTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.com.dikec.dpi]
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: Dikec DPI Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dikec.dpi.tunnel
        SWIFT_OBJC_BRIDGING_HEADER: Tunnel/Tunnel-Bridging-Header.h
